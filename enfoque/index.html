<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Enfoque</title>
<meta name="description" content="Trackeá tu tiempo de foco vs. scroll.">
<meta name="theme-color" content="#0b0c12">

<!-- PWA / iOS home screen -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Enfoque">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <header class="app-header">
    <h1>Enfoque</h1>
    <p id="phrase" class="phrase" aria-live="polite"></p>
  </header>

  <!-- Active session banner -->
  <section id="activeBanner" class="active-banner hidden">
    <div class="active-info">
      <span id="activeLabel" class="active-label">—</span>
      <span id="activeTimer" class="active-timer">00:00:00</span>
    </div>
    <button id="finishBtn" class="btn btn-finish">Finalizar</button>
  </section>

  <!-- Scroll tracker -->
  <section class="card scroll-card">
    <div class="card-head">
      <span class="card-title">📱 Scroll</span>
      <span id="scrollWeekTotal" class="card-sub">0m esta semana</span>
    </div>
    <button id="scrollBtn" class="btn btn-scroll">Empecé a scrollear</button>
  </section>

  <!-- Focus categories -->
  <section class="card">
    <div class="card-head">
      <span class="card-title">🎯 Enfoque</span>
    </div>
    <div class="grid">
      <button class="btn btn-cat" data-cat="estudiar" style="--c:#6c8cff">📚 Estudiar</button>
      <button class="btn btn-cat" data-cat="leer" style="--c:#4cc9a0">📖 Leer</button>
      <button class="btn btn-cat" data-cat="aprender" style="--c:#b389f9">🧠 Aprender</button>
      <button class="btn btn-cat" data-cat="proyecto" style="--c:#ffb454">🚀 Proyecto</button>
    </div>
  </section>

  <!-- Weekly chart -->
  <section class="card">
    <div class="card-head">
      <span class="card-title">Esta semana</span>
      <span id="weekRange" class="card-sub"></span>
    </div>
    <div id="chart" class="chart"></div>
    <div id="legend" class="legend"></div>
  </section>

  <!-- History -->
  <section class="card">
    <div class="card-head">
      <span class="card-title">Hoy</span>
    </div>
    <ul id="history" class="history"></ul>
    <p id="historyEmpty" class="empty hidden">Todavía no registraste nada hoy.</p>
  </section>

  <footer class="footer">
    <p>¿Cómo te ves a las 40?</p>
  </footer>

</div>

<script src="js/app.js"></script>
</body>
</html>
